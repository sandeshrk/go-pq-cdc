name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Lint
        run: |
          make lint

      - name: Install dependencies
        run: |
          make tidy

      - name: Build
        run: |
          make build/linux

      - name: Unit Test
        run: go test -v ./...

  security-gates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      APPSEC_ELASTIC_URL: ${{ secrets.APPSEC_ELASTIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p sarif
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz
          ./gitleaks detect --source . --report-format sarif --report-path sarif/gitleaks.sarif --redact --exit-code=0

      - name: Run Semgrep
        run: |
          image=semgrep/semgrep@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          docker pull "$image"
          docker run --rm --entrypoint semgrep -v "$PWD:/src" -w /src "$image" \
            scan --config=p/default --metrics=off --sarif --output=sarif/semgrep.sarif || true

      - name: Run Grype
        run: |
          wget -q https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          echo "64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519  grype_0.121.0_linux_amd64.tar.gz" | sha256sum -c
          tar -xzf grype_0.121.0_linux_amd64.tar.gz
          ./grype dir:. -o sarif > sarif/grype.sarif || true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: always() && github.event.repository.private == false
        with:
          sarif_file: sarif
          checkout_path: ${{ github.workspace }}

      # The scanners always run. This post runs only when the repository has the
      # endpoint secret. An empty URL makes curl fail the job.
      - name: Send results to the endpoint
        if: env.APPSEC_ELASTIC_URL
        env:
          APPSEC_ELASTIC_USER: ${{ secrets.APPSEC_ELASTIC_USER }}
          APPSEC_ELASTIC_PASS: ${{ secrets.APPSEC_ELASTIC_PASS }}
          CA_CERT: ${{ secrets.APPSEC_CA }}
        run: |
          echo "$CA_CERT" > trendyolrootca.crt
          count() { jq '[.runs[].results[]?] | length' "$1" 2>/dev/null || echo 0; }
          payload=$(jq -n \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repo "${{ github.repository }}" \
            --argjson leaks "$(count sarif/gitleaks.sarif)" \
            --argjson semgrep "$(count sarif/semgrep.sarif)" \
            --argjson grype "$(jq '[.runs[].results[]? | select(.properties.severity == "Critical")] | length' sarif/grype.sarif 2>/dev/null || echo 0)" \
            '{
              "@timestamp": $timestamp,
              repository: $repo,
              vulnerability_summary: {gitleaks: $leaks, semgrep_total: $semgrep, grype_critical: $grype}
            }')
          curl -sS -X POST "$APPSEC_ELASTIC_URL" \
            -u "$APPSEC_ELASTIC_USER:$APPSEC_ELASTIC_PASS" \
            --cacert trendyolrootca.crt \
            -H "Content-Type: application/json" \
            -d "$payload"
